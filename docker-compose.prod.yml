name: smartstaff-prod

# Local production-style stack. It uses its own volume and does not attach to smartstaff_pgdata.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartstaff_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartstaff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<version>.
      - smartstaff_prod_pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartstaff} -d ${POSTGRES_DB:-smartstaff_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      HTTPS_REDIRECT: "false"
      COOKIE_SECURE: "false"
      PASSWORD_RESET_DEV_SINK: "false"
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-2000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-smartstaff_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartstaff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY to at least 32 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-SmartStaff}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-SmartStaff}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-15}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5081:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  smartstaff_prod_pgdata:
