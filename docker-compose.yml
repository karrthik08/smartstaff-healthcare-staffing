name: smartstaff

# The database is the existing container smartstaff-postgres.
# It publishes PostgreSQL 18 on 127.0.0.1:5433 and keeps the smartstaff_pgdata volume.
# This file does not define, recreate, or remove that container.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5433"
      POSTGRES_DB: ${POSTGRES_DB:-smartstaff_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartstaff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell or .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-SmartStaff}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-SmartStaff}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5080}
    ports:
      - "8080:80"
    depends_on:
      - api
